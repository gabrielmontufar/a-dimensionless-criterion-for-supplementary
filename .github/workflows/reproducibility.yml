name: reproducibility

on:
  push:
  pull_request:

jobs:
  fast-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_quick.txt
      - run: python scripts/quick_check.py
      - run: pip install -r requirements_core.txt
      - run: python scripts/reproduce_core.py
